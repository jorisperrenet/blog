name: Deploy blog to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: project-cube

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build Rust binaries
        working-directory: project-cube
        run: cargo build --release --bin build_solver_db --bin generate_blog_examples --bin graph_viz

      # view_counts.txt and view_counts_all.txt are committed to the repo
      # (they're slow to enumerate). build_solver_db and generate_blog_examples
      # only read them.
      - name: Generate Project Cube assets
        working-directory: project-cube
        run: |
          ./target/release/build_solver_db
          ./target/release/generate_blog_examples

      - name: Install npm dependencies
        run: npm ci

      - name: Build SvelteKit blog
        env:
          BASE_PATH: /blog
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
