<!DOCTYPE html><html><head><meta charset="utf-8"><title>impossible pair</title>
<style>html,body{margin:0;height:100%;overflow:hidden}body{font-family:Georgia,serif;background:#fafaf7;color:#222;
padding:24px 16px;text-align:center;box-sizing:border-box}h2{margin:0 0 10px 0;font-size:1.3em}
.lead{max-width:520px;margin:0 auto 24px;font-size:0.95em;color:#555}
.cards{display:flex;justify-content:center;align-items:center;gap:28px;flex-wrap:wrap}
.card-block{display:flex;flex-direction:column;align-items:center;gap:6px}
.card-block .label{font-size:0.85em;color:#777;text-transform:uppercase;letter-spacing:0.05em}
.cross{font-size:2em;color:#aaa;font-weight:300}</style>
</head><body>
<h2>Impossible pair</h2>
<p class="lead">No arrangement of pieces matches both silhouettes. This pair appears once you've added <em>both</em> <code>.#.|###|###</code> and <code>#..|###|###</code> to the deck — neither silhouette breaks anything on its own, but in combination they refer to a tower that cannot exist.</p>
<div class="cards">
  <div class="card-block">
    <div class="label">front</div>
    <svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180"><rect width="100%" height="100%" fill="#fffbf0" stroke="#5a4a30" stroke-width="3"/><rect x="4" y="118" width="57" height="57" fill="#3a3a3a"/><rect x="61" y="118" width="57" height="57" fill="#3a3a3a"/><rect x="118" y="118" width="57" height="57" fill="#3a3a3a"/><rect x="4" y="61" width="57" height="57" fill="#3a3a3a"/><rect x="61" y="61" width="57" height="57" fill="#3a3a3a"/><rect x="118" y="61" width="57" height="57" fill="#3a3a3a"/><rect x="61" y="4" width="57" height="57" fill="#3a3a3a"/></svg>
  </div>
  <div class="cross">×</div>
  <div class="card-block">
    <div class="label">side</div>
    <svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180"><rect width="100%" height="100%" fill="#fffbf0" stroke="#5a4a30" stroke-width="3"/><rect x="4" y="118" width="57" height="57" fill="#3a3a3a"/><rect x="4" y="61" width="57" height="57" fill="#3a3a3a"/><rect x="61" y="61" width="57" height="57" fill="#3a3a3a"/><rect x="118" y="61" width="57" height="57" fill="#3a3a3a"/><rect x="4" y="4" width="57" height="57" fill="#3a3a3a"/><rect x="61" y="4" width="57" height="57" fill="#3a3a3a"/><rect x="118" y="4" width="57" height="57" fill="#3a3a3a"/></svg>
  </div>
</div>
</body></html>
